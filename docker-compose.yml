services:
  app:
    build: .
    ports:
      - "${APP_PORT}:80"
    env_file:
      - .env
    environment:
      # Ensure container talks to the compose DB service by name
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      - uploads_data:/var/www/html/public/uploads
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - phs_net

  db:
    image: mariadb:11
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - phs_net

volumes:
  db_data:
  uploads_data:
  storage_data:

networks:
  phs_net:
    driver: bridge
